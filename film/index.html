<!doctype html>
<html lang="de" data-resolution="landscape">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <title>KFZ Oberberg – Hero-Film</title>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { margin: 0; width: 1920px; height: 1080px; overflow: hidden; background: #0d0f10; }
      #root { position: relative; width: 100%; height: 100%; overflow: hidden; background: #0d0f10; }
      .clip { position: absolute; inset: 0; overflow: hidden; }
      .kb { position: absolute; inset: 0; width: 100%; height: 100%; }
      #kb1, #kb1b { transform-origin: 50% 18%; }
      .kb img { display: block; width: 100%; height: 100%; object-fit: cover; }
      /* Abdunklung unten/links, damit Text der Webseite darauf lesbar bleibt */
      #shade { position: absolute; inset: 0; z-index: 5;
        background:
          linear-gradient(90deg, rgba(13,15,16,.55) 0%, rgba(13,15,16,.15) 55%, rgba(13,15,16,0) 100%),
          linear-gradient(0deg, rgba(13,15,16,.6) 0%, rgba(13,15,16,0) 45%); }
      .wipe { position: absolute; top: -200px; left: 0; width: 2600px; height: 1480px; z-index: 10;
        background: repeating-linear-gradient(-45deg, #15171a 0 70px, #e8b417 70px 140px); }
      .wipe .edge { position: absolute; top: 0; bottom: 0; right: 0; width: 28px; background: #e8b417; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="12" data-width="1920" data-height="1080">
      <section id="s1" class="clip" data-start="0" data-duration="2" data-track-index="0">
        <div class="kb" id="kb1" data-layout-allow-overflow><img src="assets/garage-front.jpg" alt="" data-color-grading='{"intensity":0.8,"adjust":{"contrast":0.12,"saturation":-0.15,"highlights":-0.1,"shadows":-0.04},"details":{"vignette":0.25,"grain":0.12}}' /></div>
      </section>
      <section id="s2" class="clip" data-start="2" data-duration="2" data-track-index="0">
        <div class="kb" id="kb2" data-layout-allow-overflow><img src="assets/motor-dunkel.jpg" alt="" data-color-grading='{"intensity":0.8,"adjust":{"contrast":0.12,"saturation":-0.15,"highlights":-0.1},"details":{"vignette":0.25,"grain":0.12}}' /></div>
      </section>
      <section id="s3" class="clip" data-start="4" data-duration="2" data-track-index="0">
        <div class="kb" id="kb3" data-layout-allow-overflow><img src="assets/bremse.jpg" alt="" data-color-grading='{"intensity":0.8,"adjust":{"contrast":0.12,"saturation":-0.2,"exposure":-0.06,"highlights":-0.12},"details":{"vignette":0.3,"grain":0.12}}' /></div>
      </section>
      <section id="s4" class="clip" data-start="6" data-duration="2" data-track-index="0">
        <div class="kb" id="kb4" data-layout-allow-overflow><img src="assets/reifen.jpg" alt="" data-color-grading='{"intensity":0.8,"adjust":{"contrast":0.14,"saturation":-0.15},"details":{"vignette":0.25,"grain":0.12}}' /></div>
      </section>
      <section id="s5" class="clip" data-start="8" data-duration="2" data-track-index="0">
        <div class="kb" id="kb5" data-layout-allow-overflow><img src="assets/inspektion.jpg" alt="" data-color-grading='{"intensity":0.8,"adjust":{"contrast":0.12,"saturation":-0.1,"highlights":-0.1},"details":{"vignette":0.25,"grain":0.12}}' /></div>
      </section>
      <section id="s6" class="clip" data-start="10" data-duration="1.75" data-track-index="0">
        <div class="kb" id="kb6" data-layout-allow-overflow><img src="assets/elektrik.jpg" alt="" data-color-grading='{"intensity":0.8,"adjust":{"contrast":0.12,"saturation":-0.15,"exposure":-0.04},"details":{"vignette":0.25,"grain":0.12}}' /></div>
      </section>
      <!-- Schleifenschluss: Einstellung 1 kehrt zurück, damit Bild 12 s == Bild 0 s -->
      <section id="s1b" class="clip" data-start="11.75" data-duration="0.25" data-track-index="0">
        <div class="kb" id="kb1b" data-layout-allow-overflow><img src="assets/garage-front.jpg" alt="" data-color-grading='{"intensity":0.8,"adjust":{"contrast":0.12,"saturation":-0.15,"highlights":-0.1,"shadows":-0.04},"details":{"vignette":0.25,"grain":0.12}}' /></div>
      </section>

      <div id="shade"></div>
      <div class="wipe" id="w1" data-layout-allow-overflow><div class="edge"></div></div>
      <div class="wipe" id="w2" data-layout-allow-overflow><div class="edge"></div></div>
      <div class="wipe" id="w3" data-layout-allow-overflow><div class="edge"></div></div>
      <div class="wipe" id="w4" data-layout-allow-overflow><div class="edge"></div></div>
      <div class="wipe" id="w5" data-layout-allow-overflow><div class="edge"></div></div>
      <div class="wipe" id="w6" data-layout-allow-overflow><div class="edge"></div></div>
    </div>
    <script>
      const tl = gsap.timeline({ paused: true });

      // Kamerafahrten (Ken Burns) auf dem inneren Wrapper, nie auf dem .clip
      tl.fromTo("#kb2", { scale: 1.18, x: 60 }, { scale: 1.05, x: -40, duration: 2, ease: "none" }, 2);
      tl.fromTo("#kb3", { scale: 1.05, y: 30 }, { scale: 1.2, y: -20, duration: 2, ease: "none" }, 4);
      tl.fromTo("#kb4", { scale: 1.15, x: -70 }, { scale: 1.15, x: 70, duration: 2, ease: "none" }, 6);
      tl.fromTo("#kb5", { scale: 1.22, x: 40, y: 20 }, { scale: 1.08, x: -20, y: -10, duration: 2, ease: "none" }, 8);
      tl.fromTo("#kb6", { scale: 1.06 }, { scale: 1.2, duration: 1.75, ease: "none" }, 10);

      // Einstellung 1 läuft virtuell von -0.25 s bis 2 s; ihr Anfang wird am Ende der Schleife gezeigt
      const S0 = 1.36, S1 = 1.2, virt = 2.25;
      const sAt = (t) => S0 + (S1 - S0) * ((t + 0.25) / virt);
      tl.fromTo("#kb1", { scale: sAt(0) }, { scale: S1, duration: 2, ease: "none" }, 0);
      tl.fromTo("#kb1b", { scale: S0 }, { scale: sAt(0), duration: 0.25, ease: "none" }, 11.75);

      // Warnstreifen-Wischer: decken den Schnitt in der Mitte ihrer Fahrt komplett ab
      const cuts = [2, 4, 6, 8, 10, 11.75];
      cuts.forEach((c, i) => {
        const id = "#w" + (i + 1);
        const half = i === 5 ? 0.25 : 0.32;
        tl.fromTo(id, { x: -3200, skewX: -12 }, { x: -340, skewX: -12, duration: half, ease: "power3.in" }, c - half);
        tl.to(id, { x: 2500, skewX: -12, duration: half, ease: "power3.out" }, c);
      });

      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
